services:
  - type: web
    name: tlv-production-forum
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: MONGODB_URI
        sync: false

      - key: MONGODB_DATABASE
        value: tlv_production
